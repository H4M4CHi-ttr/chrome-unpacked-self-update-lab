<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub 自己更新実験</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
<main>
  <header><h1>GitHub 自己更新実験</h1></header>
  <section id="update-panel" aria-labelledby="settings-title">
    <h2 id="settings-title" tabindex="-1">更新設定</h2>
    <p id="folder-guide"></p>
    <div id="folder-settings" class="actions" hidden>
      <button id="grant" class="primary" aria-describedby="folder-guide" hidden disabled>保存したフォルダを再許可</button>
      <button id="pick" class="primary" aria-describedby="folder-guide" disabled>拡張機能フォルダを選ぶ</button>
      <button id="restore" class="primary" hidden disabled>中断した更新を旧版に戻す</button>
      <button id="forget" hidden disabled>フォルダ登録を解除</button>
    </div>
    <dl id="update-state">
      <div><dt>フォルダへの書き込み</dt><dd id="permission">確認中</dd></div>
      <div><dt>自動更新</dt><dd id="enabled">確認中</dd></div>
    </dl>
    <div class="actions">
      <button id="updater" class="primary" aria-describedby="folder-guide">更新設定を開く</button>
      <button id="enable" class="primary" hidden disabled>自動更新を有効にする</button>
      <button id="disable" hidden disabled>自動更新を停止</button>
      <button id="check" disabled>今すぐ確認</button>
      <button id="apply" hidden disabled>取得済みの更新を適用</button>
    </div>
    <p id="status" role="status" aria-live="polite">設定を読み込み中…</p>
  </section>
  <details id="version-details">
    <summary>バージョンと実行結果</summary>
    <dl>
      <div><dt>拡張機能のバージョン</dt><dd id="manifest-version">確認中</dd></div>
      <div><dt>実行中のコード版</dt><dd id="version">確認中</dd></div>
      <div><dt>確認間隔</dt><dd id="interval">確認中</dd></div>
      <div><dt>取得済みの更新</dt><dd id="pending">なし</dd></div>
    </dl>
    <section id="demo"><h2>active.js を読み込み中…</h2><p></p></section>
  </details>
  <details id="release-access">
    <summary>GitHub アクセストークン（プライベート用）</summary>
    <p id="release-token-help" class="hint">プライベートリポジトリの場合にのみ必要です。この公開デモでは登録不要です。</p>
    <p class="hint"><a id="create-release-token" href="https://github.com/settings/personal-access-tokens/new?contents=read"
      target="_blank" rel="noreferrer">GitHub で Fine-grained token を発行</a>し、対象リポジトリだけを選びます。
      <code>Contents</code> を <code>Read-only</code> にして、有効期限を設定してください。</p>
    <form id="release-token-form">
      <fieldset id="release-token-controls" disabled>
        <label for="release-token">アクセストークン</label>
        <input id="release-token" type="password" required autocomplete="off" spellcheck="false" aria-describedby="release-token-help">
        <div class="actions">
          <button type="submit">登録</button>
          <button id="delete-release-token" type="button" disabled>登録を削除</button>
        </div>
      </fieldset>
      <p id="release-token-state" class="hint" role="status" hidden></p>
    </form>
  </details>
  <details><summary>実験ログ</summary><pre id="events"></pre></details>
</main>
</body>
</html>
