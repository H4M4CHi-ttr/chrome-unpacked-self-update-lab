name: Hourly demo release

on:
  # cron-job.org calls workflow_dispatch every hour for this demo.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish if at least 60 minutes have passed (unchecked only verifies assets)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: hourly-demo-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'H4M4CHi-ttr/chrome-unpacked-self-update-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check time since the last release
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REQUESTED: ${{ inputs.publish == true }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '[.tag_name, .published_at] | @tsv')"
          IFS=$'\t' read -r latest published_at <<< "$release"
          if [[ -z "$latest" || -z "$published_at" ]]; then
            echo "The latest release must have a tag and a publication time." >&2
            exit 1
          fi
          published_epoch="$(date -u -d "$published_at" +%s)"
          if [[ "$PUBLISH_REQUESTED" == "true" ]]; then
            wait_seconds=$((published_epoch + 3600 - $(date -u +%s)))
            if (( wait_seconds > 120 )); then
              echo "The latest release ($latest) was published less than 58 minutes ago. Skipping build and publish."
              exit 0
            fi
            # An on-the-hour dispatch can land seconds before the release cooldown ends.
            if (( wait_seconds > 0 )); then
              echo "Waiting $wait_seconds seconds before the next release is eligible."
              sleep "$wait_seconds"
            fi
          fi
          printf 'latest=%s\n' "$latest" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cadence.outputs.latest != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cadence.outputs.latest != ''
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify updater
        if: steps.cadence.outputs.latest != ''
        run: |
          node --test tests/*.test.mjs
          node tools/build-release.mjs --check-index
      - name: Select the release baseline or next patch
        id: version
        if: steps.cadence.outputs.latest != ''
        env:
          LATEST: ${{ steps.cadence.outputs.latest }}
        run: |
          tag="$(node tools/build-release.mjs --next "$LATEST")"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Build and verify signed release assets
        if: steps.cadence.outputs.latest != ''
        env:
          DEMO_SIGNING_KEY_PEM: ${{ secrets.DEMO_SIGNING_KEY_PEM }}
          TAG: ${{ steps.version.outputs.tag }}
        run: node tools/build-release.mjs "${TAG#v}" "$RUNNER_TEMP/demo-release"
      - name: Publish the demo release
        if: steps.version.outputs.tag != '' && inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_LATEST: ${{ steps.cadence.outputs.latest }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "main changed after checkout. Run again from the current main."
            exit 1
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$latest" != "$EXPECTED_LATEST" ]]; then
            echo "A different release is now latest. The next run will check the interval again."
            exit 0
          fi
          gh release create "$TAG" \
            "$RUNNER_TEMP/demo-release/auto-update-https.zip" "$RUNNER_TEMP/demo-release/update.zip" \
            "$RUNNER_TEMP/demo-release/update.json" "$RUNNER_TEMP/demo-release/update.sig" \
            "$RUNNER_TEMP/demo-release/package-update.json" "$RUNNER_TEMP/demo-release/package-update.sig" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --latest \
            --notes "初回インストールで「更新設定」が開き、フォルダへの書き込みを許可すると自動更新がオンになります。後で再許可が必要とわかると、設定タブが一度だけ前面に出ます。「保存したフォルダを再許可」を押し、Chrome に「サイトアクセス時は常に許可」が表示されたら選んでください。拡張機能内の自動更新を利用中なら、登録済みのフォルダのまま更新できます。旧 HTTPS 更新ページ版からは、この ZIP を展開して手動で読み込み、フォルダを登録してください。"
